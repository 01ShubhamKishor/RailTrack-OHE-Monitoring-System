server:
  port: 8040

spring:
  application:
    name: railtrack-ohe

  datasource:
    url: jdbc:mysql://localhost:3306/railtrack-ohe?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 2023
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # Ye abhi ke liye dummy hai, Day 2 me OTP ke liye kaam ayega
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# JWT - Day 2 ke Auth ke liye must hai
app:
  jwtSecret: railtrackSuperSecretKeyForJobProjectMakeItVeryLong1234567890ChangeThis
  jwtExpirationMs: 86400000

# Swagger UI - Recruiter ko impress karega
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html